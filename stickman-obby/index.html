<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stickman Obby — 宝石跑酷</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#243b60,#0b1220 70%);color:#f7fbff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center}
.app{width:min(1100px,100%);padding:16px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.brand{font-weight:1000;font-size:clamp(23px,4vw,34px);color:#8be9fd;letter-spacing:.5px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#24334b;border:1px solid #405575;padding:8px 12px;border-radius:999px;font-size:14px}
button{border:0;border-radius:12px;padding:11px 17px;font-weight:850;background:#39d5a4;color:#09251e;cursor:pointer;font-size:15px}button.secondary{background:#334761;color:#fff}button.gold{background:#ffcf58;color:#3b2700}button:disabled{opacity:.4;cursor:not-allowed}
.stage{position:relative}canvas{width:100%;height:auto;display:block;border:3px solid #49617e;border-radius:18px;background:#b8e7ff;box-shadow:0 20px 60px #0008}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 2px;color:#c9d8ea;font-size:14px}
.overlay{position:absolute;inset:3px;border-radius:15px;background:linear-gradient(145deg,#101d31ed,#152b45ed);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;overflow:auto}
.panel{width:min(640px,100%)}.panel h1{font-size:clamp(30px,6vw,52px);margin:0 0 8px;color:#8be9fd}.panel p{color:#c4d5e8;line-height:1.5}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}.skin{border:1px solid #49617e;background:#243650;border-radius:14px;padding:12px}.skin.selected{outline:3px solid #39d5a4}.skin .preview{font-size:36px;margin:4px}.skin small{color:#c2d0e1;display:block;margin:5px}
.mobile{display:none;justify-content:center;gap:14px;margin-top:10px}.mobile button{min-width:74px;font-size:20px;touch-action:none}
@media(max-width:650px){.mobile{display:flex}.hud{font-size:12px}.app{padding:8px}.pill{font-size:12px}}
</style></head>
<body><main class="app">
<div class="bar"><div class="brand">⚡ STICKMAN OBBY</div><div class="stats"><span class="pill" id="levelLabel">关卡 1 / 10</span><span class="pill" id="gemLabel">💎 0 宝石</span></div></div>
<div class="stage"><canvas id="game" width="960" height="540"></canvas>
<section class="overlay" id="overlay"><div class="panel"><h1>STICKMAN OBBY</h1><p>跑、跳、弹飞！挑战 10 个越来越难的世界。每通关一关获得 10 颗宝石，用宝石兑换酷炫皮肤。</p><div class="actions"><button id="playBtn">开始冒险</button><button class="gold" id="shopBtn">💎 皮肤商店</button></div><p>键盘：← → / A D 移动，空格 / ↑ 二段跳，C 滑铲。</p></div></section>
</div>
<div class="hud"><span id="message">准备好开始冒险了吗？</span><div><button class="secondary" id="homeBtn">首页</button> <button class="secondary" id="restartBtn">重玩本关 ↻</button></div></div>
<div class="mobile"><button id="left">◀</button><button id="jump">⬆ 跳</button><button id="right">▶</button></div>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const overlay=document.getElementById('overlay'),gemLabel=document.getElementById('gemLabel'),levelLabel=document.getElementById('levelLabel'),message=document.getElementById('message');
const themes=[
['#8ed8ff','#e8faff','#347c69','#f04452','草原起跑'],['#ffb36b','#ffe2a6','#9b6338','#ef5144','熔岩峡谷'],['#9b9cff','#e6ddff','#5456a8','#fb668c','紫晶洞穴'],['#75e5d2','#d8fff5','#247c78','#f2a33a','天空弹跳岛'],['#f5a8c9','#ffe5ef','#a64d82','#e74f65','糖果工厂'],['#8197b8','#dce7f8','#526780','#ff654f','机械废墟'],['#65c7ed','#d8f7ff','#28759a','#ffae42','冰雪高塔'],['#c18af2','#f1ddff','#7043a0','#fa5579','幻影森林'],['#ffca72','#fff0c2','#a86c30','#ef3d42','烈焰要塞'],['#182844','#536b98','#384e72','#ff477e','终极挑战']];
const skins=[{name:'经典黑',color:'#172238',price:0,emoji:'🕴️'},{name:'霓虹蓝',color:'#23c9ff',price:30,emoji:'💠'},{name:'烈焰红',color:'#ff594f',price:30,emoji:'🔥'},{name:'黄金战士',color:'#ffc83d',price:30,emoji:'👑'},{name:'森林绿',color:'#48d597',price:30,emoji:'🌿'},{name:'紫色幻影',color:'#bd83ff',price:30,emoji:'🔮'},{name:'棉花糖',color:'#ff9fd2',price:30,emoji:'🍬'}];
let save={gems:0,unlocked:1,claimed:[],owned:[0],skin:0};try{save={...save,...JSON.parse(localStorage.getItem('stickmanObbySave')||'{}')}}catch(e){} save.gearOwned=save.gearOwned||{帽子:[0],衣服:[0],裤子:[0],鞋子:[0]};save.gearEquipped=save.gearEquipped||{帽子:0,衣服:0,裤子:0,鞋子:0};
function persist(){localStorage.setItem('stickmanObbySave',JSON.stringify(save));gemLabel.textContent='💎 '+save.gems+' 宝石'}
let level=1,world=null,p={x:55,y:0,vx:0,vy:0,w:24,h:48,on:false},camera=0,keys={},deaths=0,mode='menu',checkpointX=55,checkpointY=422,won=false,clock=0;
function makeLevel(n){
 const idx=n-1,theme=themes[idx],platforms=[{x:0,y:470,w:250,h:70} ],lava=[],pads=[],checks=[];
 let x=250,y=430;
 const count=16+idx*2,pattern=idx%5;
 for(let i=0;i<count;i++){
   const gap=65+Math.min(45,idx*4)+(i%3===1?25:0);
   x+=gap;
   const w=Math.max(95,150-idx*3+(i%4===0?28:0));
   const shifts=[[-18,-35,12,35],[-35,22,-48,18],[25,-55,38,-20],[-50,-15,45,-38],[18,-42,-8,52]];
   y=Math.max(190,Math.min(435,y+shifts[pattern][i%4]));
   platforms.push({x,y,w,h:18});
   if(i%3!==1)lava.push({x:x-gap+8,y:490,w:Math.max(30,gap-16),h:50});
   if((i+idx)%4===2)pads.push({x:x+w*.45,y:y-12,w:34,h:12});
   if(i===Math.floor(count*.48)||i===Math.floor(count*.78))checks.push({x:x+w*.5,y:y-52,hit:false});
   x+=w;
 }
 x+=100;platforms.push({x,y:Math.min(440,y+45),w:260,h:70});
 return {name:theme[4],sky:theme[0],sky2:theme[1],ground:theme[2],lavaColor:theme[3],platforms,lava,pads,checks,goal:{x:x+185,y:Math.min(440,y+5),w:40,h:70},length:x+320};
}
function setLevel(n){level=n;world=makeLevel(n);p={x:55,y:422,vx:0,vy:0,w:24,h:48,on:false};camera=0;checkpointX=55;checkpointY=422;deaths=0;won=false;mode='game';overlay.style.display='none';levelLabel.textContent='关卡 '+level+' / 10';message.textContent=world.name+'：小心前方障碍！';}
function showHome(){mode='menu';overlay.style.display='flex';overlay.innerHTML='<div class="panel"><h1>STICKMAN OBBY</h1><p>🏁 10 个独特世界 · ⚡ 弹板机关 · 💎 宝石奖励</p><p>已解锁 '+save.unlocked+'/10 关　　💎 '+save.gems+' 宝石</p><div class="actions"><button id="playBtn">继续冒险（第 '+Math.min(save.unlocked,10)+' 关）</button><button class="gold" id="shopBtn">💎 皮肤商店</button></div><p>每通关一关获得 10 宝石。30 宝石兑换一款皮肤。</p></div>';document.getElementById('playBtn').onclick=()=>setLevel(Math.min(save.unlocked,10));document.getElementById('shopBtn').onclick=showShop;}
function showShop(){mode='shop';overlay.style.display='flex';let cards=skins.map((s,i)=>'<div class="skin '+(save.skin===i?'selected':'')+'"><div class="preview" style="color:'+s.color+'">♟</div><b>'+s.name+'</b><small>'+(save.owned.includes(i)?(save.skin===i?'正在使用':'已拥有'):s.price+' 💎')+'</small><button '+(save.owned.includes(i)?'':'')+' data-skin="'+i+'">'+(save.owned.includes(i)?(save.skin===i?'使用中':'使用'): '兑换')+'</button></div>').join('');overlay.innerHTML='<div class="panel"><h1>💎 皮肤商店</h1><p>当前宝石：'+save.gems+'　每款新皮肤 30 宝石</p><div class="cards">'+cards+'</div><div class="actions"><button class="secondary" id="backBtn">返回首页</button></div></div>';overlay.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{let i=+b.dataset.skin;if(save.owned.includes(i)){save.skin=i;}else if(save.gems>=30){save.gems-=30;save.owned.push(i);save.skin=i;}else{message.textContent='宝石不足！再通关几关就能兑换啦。';return;}persist();showShop();});document.getElementById('backBtn').onclick=showHome;}
function completeLevel(){if(won)return;won=true;mode='won';if(!save.claimed.includes(level)){save.gems+=10;save.claimed.push(level)}save.unlocked=Math.max(save.unlocked,Math.min(10,level+1));persist();overlay.style.display='flex';overlay.innerHTML='<div class="panel"><h1>🏆 关卡完成！</h1><p>'+world.name+' 挑战成功！</p><p style="font-size:25px;color:#ffdc70">+10 💎 宝石</p><p>当前宝石：'+save.gems+'</p><div class="actions"><button id="nextBtn">'+(level===10?'返回首页':'下一关 →')+'</button><button class="secondary" id="againBtn">重玩本关</button><button class="secondary" id="home2">首页</button></div></div>';document.getElementById('nextBtn').onclick=()=>level===10?showHome():setLevel(level+1);document.getElementById('againBtn').onclick=()=>setLevel(level);document.getElementById('home2').onclick=showHome;message.textContent='通关奖励已领取！';}
function respawn(){deaths++;p.x=checkpointX;p.y=checkpointY;p.vx=0;p.vy=0;p.on=false;p.jumps=0;p.sliding=0;camera=Math.max(0,Math.min(world.length-W,p.x-300));message.textContent='哎呀！已回到检查点。失误：'+deaths;}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x-camera,y,w,h)}
function drawStick(){let s=skins[save.skin],x=p.x-camera+12,y=p.y;ctx.strokeStyle=s.color;ctx.lineWidth=5;ctx.lineCap='round';let run=(!p.on?0:Math.sin(clock*.024)*.75),arm=(!p.on?-.5:Math.cos(clock*.024)*.65);ctx.beginPath();ctx.arc(x,y+8,8,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+17);ctx.lineTo(x,y+33);ctx.moveTo(x,y+21);ctx.lineTo(x-11+arm*7,y+28-arm*4);ctx.moveTo(x,y+21);ctx.lineTo(x+11-arm*7,y+28+arm*4);ctx.moveTo(x,y+33);ctx.lineTo(x-8+run*10,y+47);ctx.moveTo(x,y+33);ctx.lineTo(x+8-run*10,y+47);ctx.stroke();}
function draw(){if(!world){ctx.fillStyle='#15263d';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 40px system-ui';ctx.textAlign='center';ctx.fillText('STICKMAN OBBY',W/2,H/2);ctx.textAlign='left';return;}let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,world.sky);g.addColorStop(1,world.sky2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.globalAlpha=.22;for(let i=0;i<12;i++){let xx=((i*170-camera*.2)%(W+180)+W+180)%(W+180)-70;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(xx,80+(i%4)*40,25,0,7);ctx.fill()}ctx.globalAlpha=1;
world.platforms.forEach(q=>{rect(q.x,q.y,q.w,q.h,world.ground);rect(q.x,q.y,q.w,6,'#ffffff66')});world.lava.forEach(q=>{rect(q.x,q.y,q.w,q.h,world.lavaColor);rect(q.x,q.y,q.w,7,'#ffd166')});
world.pads.forEach(q=>{rect(q.x,q.y,q.w,q.h,'#ffcf58');rect(q.x+4,q.y+3,q.w-8,4,'#fff2a8')});
world.checks.forEach(q=>{rect(q.x,q.y,5,52,'#26344b');rect(q.x+5,q.y,26,16,q.hit?'#39d5a4':'#ffcf58')});
let z=world.goal;rect(z.x,z.y,5,75,'#26344b');rect(z.x+5,z.y,40,24,'#ffcf58');ctx.fillStyle='#172238';ctx.font='bold 14px system-ui';ctx.fillText('FINISH',z.x-camera-4,z.y-10);drawStick();
ctx.fillStyle='#172238aa';ctx.fillRect(18,18,170,38);ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('WORLD '+level+' · '+world.name,30,43);}
function update(){
 clock++;
 if(mode==='game'&&!won){
  const dir=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);
  const sliding=!!(keys.c||keys.C);
  p.sliding=sliding?8:0;
  p.vx=dir*(sliding?6.2:4.25);p.x+=p.vx;
  const oldY=p.y;p.vy=Math.min(14,p.vy+.62);p.y+=p.vy;p.on=false;
  for(const q of world.platforms){
   if(p.x+p.w>q.x&&p.x<q.x+q.w&&oldY+p.h<=q.y+7&&p.y+p.h>=q.y&&p.vy>=0){
    p.y=q.y-p.h;p.vy=0;p.on=true;p.jumps=0;
   }
  }
  const jumpPressed=!!(keys[' ']||keys.ArrowUp||keys.w||keys.W);
  if(jumpPressed&&!keys._jumpLock&&p.jumps<2){p.vy=p.jumps===0?-12.8:-11.5;p.jumps++;p.on=false;keys._jumpLock=true;}
  if(!jumpPressed)keys._jumpLock=false;
  for(const q of world.pads){if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h<q.y+22&&p.vy>=0){p.y=q.y-p.h;p.vy=-19.5;p.on=false;p.jumps=1;message.textContent='弹板启动！飞起来！';}}
  for(const q of world.lava){if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>q.y+3)respawn();}
  if(p.y>H+90)respawn();
  world.checks.forEach(q=>{if(!q.hit&&p.x+p.w>q.x-8&&p.x<q.x+34&&p.y+p.h>q.y){q.hit=true;checkpointX=q.x+12;checkpointY=q.y+52-p.h-2;message.textContent='检查点已保存！';}});
  if(p.x+p.w>world.goal.x&&p.y+p.h>world.goal.y-12)completeLevel();
  camera=Math.max(0,Math.min(world.length-W,p.x-300));
 }
 draw();requestAnimationFrame(update);
}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;});document.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('playBtn').onclick=()=>setLevel(Math.min(save.unlocked,10));document.getElementById('shopBtn').onclick=showShop;document.getElementById('homeBtn').onclick=showHome;document.getElementById('restartBtn').onclick=()=>{if(world)setLevel(level)};function hold(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>keys[key]=false));}hold('left','ArrowLeft');hold('right','ArrowRight');hold('jump','ArrowUp');persist();showHome();update();
</script></body></html>
