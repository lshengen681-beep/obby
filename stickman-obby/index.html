<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b31">
<title>Stickman Obby - 火柴人跑酷</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#263e63,#0b1220 75%);color:#f5f8ff;font-family:"Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif;display:flex;justify-content:center;align-items:center}.app{width:min(1040px,100%);padding:16px}.top,.stats,.hud,.actions,.tabs,.mobile{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:clamp(22px,4vw,34px);font-weight:950;color:#8be9fd}.pill{padding:8px 13px;border-radius:99px;background:#263852;border:1px solid #49617e;font-size:14px}button{border:0;border-radius:12px;padding:11px 17px;background:#39d5a4;color:#09251e;font-weight:850;font-size:15px;cursor:pointer}button.gold{background:#ffcf58;color:#3b2700}button.alt{background:#344963;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.stage{position:relative;margin-top:12px}canvas{display:block;width:100%;height:auto;border:3px solid #49617e;border-radius:16px;background:#b8e7ff}.overlay{position:absolute;inset:3px;border-radius:14px;background:linear-gradient(145deg,#101d31ed,#152b45ed);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;overflow:auto}.panel{width:min(680px,100%)}h1{font-size:clamp(30px,6vw,50px);color:#8be9fd;margin:0 0 10px}.panel p{color:#c8d7e9;line-height:1.55}.actions{justify-content:center;margin:16px 0}.hud{margin:10px 2px;color:#d0dced;font-size:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:14px 0}.item{background:#263a55;border:1px solid #526b8b;border-radius:13px;padding:12px}.item.selected{outline:3px solid #39d5a4}.preview{font-size:34px}.item small{display:block;color:#c7d4e5;margin:6px}.tabs{justify-content:center}.mobile{display:none;justify-content:center;margin-top:10px}.mobile button{min-width:72px;touch-action:none;font-size:19px}@media(max-width:650px){.app{padding:8px}.mobile{display:flex}.hud{font-size:12px}.pill{font-size:12px}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><div class="brand">⚡ STICKMAN OBBY</div><div class="stats"><span class="pill" id="levelLabel">关卡 1 / 100</span><span class="pill" id="gemLabel">💎 0 宝石</span></div></header>
 <div class="stage"><canvas id="game" width="960" height="540"></canvas><section class="overlay" id="overlay"><div class="panel"><h1>STICKMAN OBBY</h1><p>挑战 100 个关卡！跑过三层平台、躲开熔岩、收集宝石，解锁帽子、衣服、裤子和鞋子。</p><div class="actions"><button id="playBtn">开始冒险</button><button class="gold" id="shopBtn">💎 装备商店</button></div><p>← → / A D 移动　·　空格 / ↑ 二段跳　·　C 滑铲</p></div></section></div>
 <div class="hud"><span id="message">准备好开始冒险了吗？</span><div><button class="alt" id="homeBtn">首页</button> <button class="alt" id="restartBtn">重玩本关 ↻</button></div></div>
 <div class="mobile"><button id="left">◀</button><button id="jump">⬆ 跳</button><button id="right">▶</button><button id="slide">滑铲</button></div>
</main>
<script src="./game.js" defer></script>
</body>
</html>
